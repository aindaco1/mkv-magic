name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, tests, Universal build, and package
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install source-gate dependencies
        run: brew install actionlint ripgrep shellcheck

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version
          actionlint --version
          rg --version
          shellcheck --version

      - name: Validate source and Universal binary
        run: ./scripts/ci/validate.sh

      - name: Exercise app package and signed update feed
        run: ./scripts/ci/package-gate.sh

  coverage:
    name: Swift coverage
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect coverage
        run: ./scripts/ci/coverage.sh

  sanitizers:
    name: Address and thread sanitizers
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run sanitizers
        run: ./scripts/ci/sanitizers.sh

  bundled-runtime:
    name: Bundled ARM64 and Intel media runtime
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select pinned runtime-build Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcode_version="$(xcodebuild -version)"
          test "${xcode_version%%$'\n'*}" = "Xcode 26.3"

      - name: Install runtime-build dependencies
        run: brew install autoconf automake cmake libtool meson ninja pkgconf

      # Only checksum-pinned source archives are cached. build-runtime.sh
      # verifies every restored archive before extracting or executing it.
      - name: Restore checksum-pinned tool sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/mkv-magic-tool-sources
          key: mkv-magic-tool-sources-v1-${{ runner.os }}-${{ hashFiles('scripts/tools/build-runtime.sh') }}

      - name: Build, package, and execute bundled tools
        env:
          MKV_MAGIC_TOOL_SOURCE_ROOT: ${{ runner.temp }}/mkv-magic-tools
          MKV_MAGIC_TOOL_CACHE: ${{ runner.temp }}/mkv-magic-tool-sources
          MKV_MAGIC_RELEASE_ROOT: ${{ runner.temp }}/mkv-magic-runtime-package
          MKV_MAGIC_REQUIRE_TOOLS: "1"
          MKV_MAGIC_VERSION: 0.0.0
          MKV_MAGIC_BUILD_NUMBER: 1
          MKV_MAGIC_BUNDLE_IDENTIFIER: com.dustwave.mkvmagic.package-gate
        run: |
          ./scripts/tools/build-runtime.sh "$MKV_MAGIC_TOOL_SOURCE_ROOT"
          MKV_MAGIC_TOOL_ROOT="$MKV_MAGIC_TOOL_SOURCE_ROOT" \
            swift test --disable-automatic-resolution \
              --filter RealTool
          ./scripts/release/build-app.sh
          ./scripts/release/sign-app.sh \
            "$MKV_MAGIC_RELEASE_ROOT/MKV Magic.app" - none
          ./scripts/release/package.sh
          MKV_MAGIC_VERIFY_NATIVE_RELEASE=1 \
            ./scripts/release/verify-dmg.sh \
              "$MKV_MAGIC_RELEASE_ROOT/MKV-Magic-0.0.0-universal.dmg"

      - name: Package exact-commit runtime for trusted release reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MKV_MAGIC_TOOL_SOURCE_ROOT: ${{ runner.temp }}/mkv-magic-tools
          MKV_MAGIC_TOOL_CACHE: ${{ runner.temp }}/mkv-magic-tool-sources
          MKV_MAGIC_CI_RUNTIME_ARTIFACT: ${{ runner.temp }}/mkv-magic-ci-runtime-${{ github.sha }}.tar.gz
        run: |
          ./scripts/tools/package-ci-runtime.sh \
            "$MKV_MAGIC_TOOL_SOURCE_ROOT" "$MKV_MAGIC_TOOL_CACHE" \
            "$MKV_MAGIC_CI_RUNTIME_ARTIFACT" "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Attest exact-commit runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/mkv-magic-ci-runtime-${{ github.sha }}.tar.gz

      - name: Retain exact-commit runtime for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mkv-magic-verified-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/mkv-magic-ci-runtime-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            GPL-2.0-or-later, GPL-3.0-or-later, LGPL-3.0-only,
            BSD-2-Clause, BSD-3-Clause, MIT
