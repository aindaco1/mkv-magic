name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve locked dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: swift
          build-mode: manual

      # GitHub recommends one architecture for Swift CodeQL. Universal output
      # remains a separate required CI and release-package invariant.
      - name: Build analyzed ARM64 application
        run: >-
          swift build -c release --arch arm64
          --product MKVMagic --disable-automatic-resolution

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: /language:swift
          output: ../results
          # GitHub code-scanning uploads require public visibility or GitHub
          # Advanced Security. Keep private-repository analysis useful by
          # retaining SARIF as a workflow artifact until the repo is public.
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}

      - name: Retain private-repository SARIF
        if: ${{ github.event.repository.visibility != 'public' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-swift-sarif-${{ github.sha }}
          path: ../results/*.sarif
          if-no-files-found: error
          retention-days: 14
